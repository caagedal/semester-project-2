<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/style.css">
    <title>Document</title>
    <script src="https://kit.fontawesome.com/4639419757.js" crossorigin="anonymous"></script>
    <script src="/src/js/render/renderListings.js" type="module"></script>
    <script src="/src/js/handlers/navbarHandle.js" type="module"></script>
    

</head>
<body class="min-h-screen flex flex-col bg-white">
    <div class="relative z-10 hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true" data-modal="modalObject"></div>
    <header class="bg-custom-green">
       <nav class="flex max-w-screen-xl items-center justify-between text-white mx-auto flex-wrap">
        <h2 class="font-marcellus text-4xl">BidPoint</h2>
        <div class="online flex gap-5" id="navInput">            
        </div>
       </nav>
    </header>
    <main class="max-w-screen-xl flex flex-col mx-auto"> 
      <section class="hero text-left p-32">
        <p class="text-2xl">Welcome to</p>
        <h1 class="text-7xl font-marcellus font-bold">BidPoint</h1>
        <p class="text-2xl">The no.1 auction page</p>
      </section>

      <section class="search-sort flex justify-end gap-5 py-4 font-marcellus">
        <div>

          <input type="search" name="search" class="rounded-full p-2" placeholder="Search here!" aria-label="search here"/>
          <button><i class="fa-solid fa-magnifying-glass"></i></button>

        </div>
        <div>
          
          <select name="sort" id="sort" class="p-2 rounded-full">
            <option value="created">Newest</option>
            <option value="oldest">Oldest</option>
            <option value="popular">Most popular</option>
            <option value="ending">Ending soon</option>
            <option value="ended">Ended</option>
          </select>
          <label for="sort"><i class="fa-solid fa-arrow-down-wide-short"></i></label>

        </div>
      </section>
      
      <section class="listing-grid flex flex-wrap gap-8 mx-auto">
        <p class="loading p-8 text-2xl flex">Loading...</p>
        <p></p>
      </section>

      <!-- loginForm -->
    
    

      <!-- RegisterForm -->

    </main>
    <footer>
    </footer>
</body>
</html>
