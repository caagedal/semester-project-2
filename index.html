<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/style.css">
    <title>Document</title>
</head>
<body class="min-h-screen flex flex-col bg-custom-white">
    <div class="relative z-10 hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true" data-modal="modalObject"></div>
    <header class="bg-custom-green">
       <nav class="flex max-w-screen-xl items-center justify-between text-white mx-auto flex-wrap">
        <h2 class="font-marcellus text-4xl">BidPoint</h2>
        <div class="offline flex gap-5">
            <button class="border-2 border-white hover:border-custom-orange text-white py-2 px-4 rounded-full" id="loginBtn">Login</button>
            <button class="button border-2 border-custom-orange bg-custom-orange hover:bg-custom-orange text-white hover:border-white py-2 px-4 rounded-full" id="registerBtn">Register</button>
        </div>
       </nav>
    </header>
    <main class="max-w-screen-xl flex flex-col mx-auto"> 
      <section class="hero text-left p-32">
        <p class="text-2xl">Welcome to</p>
        <h1 class="text-7xl font-marcellus font-bold">BidPoint</h1>
        <p class="text-2xl">The no.1 auction page</p>
      </section>
      
      <section class="listing-grid flex flex-wrap gap-8 mx-auto">
        <p class="loading p-8 text-2xl flex">Loading...</p>
      </section>

    </main>
    <footer>
    </footer>
</body>
</html>
