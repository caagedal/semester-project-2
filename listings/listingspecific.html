<!DOCTYPE html>
<html lang="en" class="h-full bg-white>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../src/style.css">
    <script src="https://kit.fontawesome.com/4639419757.js" crossorigin="anonymous"></script>
</head>
<body class="h-full">
    <div class="relative z-10" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" aria-hidden="true"></div>
      
        <div class="fixed inset-0 z-10 w-screen overflow-y-auto">
            <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
                
                <div class="relative transform overflow-hidden rounded-5xl bg-white text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-3xl">

                    <!-- Starts here -->
                  <div class="px-12 py-4">
                    <p class="text-center text-3xl text-custom-orange pb-2">Ending in 2d 3h 16m 37s</p>
                    <div>
                      <img class="rounded-5xl" src="https://images.unsplash.com/photo-1727270921836-3d51d25d9e33?q=80&w=2071&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D">
                      <div>
                        <!-- title og description -->
                        <div class="flex flex-col py-5">
                          <h1 class="text-4xl text-custom-green font-marcellus font-bold">Listing title</h1>
                          <p class="text-custom-orange text-sm pb-1">By Username3123</p>
                          <h2 class="text-xl text-custom-green">A description about the listing item, it can be long so keep that in mind.</h2>
                        </div>

                        <!-- Dates og ID -->
                        <div class="flex flex-col gap-2">
                          <div class="font-marcellus text-md">
                            <p class="font-bold">Created</p>
                            <p>12/08/1991</p>
                          </div>
                          <div class="flex justify-between font-marcellus">
                            <div class=" text-md">
                              <p class="font-bold">Ending</p>
                              <p>15/08/1991</p>
                            </div>
                            <p class="flex items-end text-sm font-bold">ID12341234123</p>
                          </div>
                        </div>

                        <!-- Bidding osv -->
                        <div class="flex flex-col gap-4 font-marcellus">
                          <div class="text-center">
                            <p class="text-4xl text-custom-green font-marcellus">Current bid</p>
                            <div class="flex justify-center gap-1 text-4xl">
                              <i class="fa-solid fa-coins text-custom-orange"></i>
                              <p class="text-custom-green">50</p>
                            </div>                          
                          </div>
                          <div class="flex justify-center">
                            <button class="bg-custom-green text-white px-6 py-2 text-3xl rounded-4xl">Place bid</button>
                          </div>
                        </div>

                        <!-- Bid history -->
                        <div>
                          <p>Bid history</p>
                          <ul>
                            <li class="flex"><i class="fa-solid fa-coins"></i><p>48</p></li>
                            <li class="flex"><i class="fa-solid fa-coins"></i><p>48</p></li>
                            <li class="flex"><i class="fa-solid fa-coins"></i><p>48</p></li>
                            <li class="flex"><i class="fa-solid fa-coins"></i><p>48</p></li>
                            <li class="flex"><i class="fa-solid fa-coins"></i><p>48</p></li>
                            <li class="flex"><i class="fa-solid fa-coins"></i><p>48</p></li>
                            <li class="flex"><i class="fa-solid fa-coins"></i><p>48</p></li>
                            <li class="flex"><i class="fa-solid fa-coins"></i><p>48</p></li>
                            <li class="flex"><i class="fa-solid fa-coins"></i><p>48</p></li>
                          </ul>
                        </div>
                        

                      </div>
                    </div>
                  </div>
                      
                </div>
            </div>
        </div>
    </div>
      
</body>
</html>
